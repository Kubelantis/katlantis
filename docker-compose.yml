# Note: This file is only used for Atlantis local development
services:
  ngrok:
    image: ngrok/ngrok:latest@sha256:14d80d083e5b53145f416bbbd36238336c9de4016c43fd950eb2eb845670583b
    ports:
      - 4040:4040
    command:
      - "http"
      - "atlantis:4141"
    env_file:
      - atlantis.env
    depends_on:
      - atlantis
  atlantis:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - 4141:4141
    volumes:
      - ${HOME}/.ssh:/.ssh:ro
      - ${PWD}:/atlantis/src:ro
      # Atlantis keeps locks and pull status in a Kubernetes API. The
      # kubeconfig's server must be reachable from inside this container
      # (for kind, use the cluster's container address, not 127.0.0.1).
      - ${HOME}/.kube/config:/kube/config:ro
    environment:
      KUBECONFIG: /kube/config
      ATLANTIS_KUBERNETES_NAMESPACE: default
      ATLANTIS_KUBERNETES_IDENTITY: atlantis-dev
      ATLANTIS_CLUSTER_ADDRESS: http://atlantis:4142
    # Contains the flags that atlantis uses in env var form
    env_file:
      - atlantis.env
