{{- if not .Values.vcsSecretName }}
{{- fail "vcsSecretName is required: create a Secret with your ATLANTIS_* VCS credentials" }}
{{- end }}
# A StatefulSet gives every replica a stable name (its identity in the
# cluster) and its own volume. A restarted replica comes back with the same
# identity and the same clones and plan files, so the pulls it owned and the
# plans it made are still there; applies wait for it (see
# --cluster-plan-holder-wait-seconds) instead of failing on another replica.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "atlantis.fullname" . }}
  labels: {{- include "atlantis.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  serviceName: {{ include "atlantis.fullname" . }}-headless
  # Replicas do not depend on each other to start.
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  {{- if .Values.persistence.enabled }}
  persistentVolumeClaimRetentionPolicy:
    # A scaled-away replica's pulls move elsewhere, so its volume is useless.
    whenScaled: Delete
    whenDeleted: Retain
  {{- end }}
  selector:
    matchLabels: {{- include "atlantis.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "atlantis.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{ end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{ end }}
    spec:
      serviceAccountName: {{ include "atlantis.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: atlantis
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["server"]
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 4141
            - name: cluster
              containerPort: {{ .Values.cluster.port }}
          envFrom:
            - secretRef:
                name: {{ .Values.vcsSecretName }}
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - name: ATLANTIS_CLUSTER_PORT
              value: {{ .Values.cluster.port | quote }}
            - name: ATLANTIS_CLUSTER_PLAN_HOLDER_WAIT_SECONDS
              value: {{ .Values.cluster.planHolderWaitSeconds | quote }}
            - name: ATLANTIS_CLUSTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "atlantis.tokenSecretName" . }}
                  key: token
            - name: ATLANTIS_ATLANTIS_URL
              value: {{ .Values.atlantisUrl | quote }}
            - name: ATLANTIS_REPO_ALLOWLIST
              value: {{ .Values.repoAllowlist | quote }}
            - name: ATLANTIS_REPO_CONFIG
              value: /etc/atlantis/repos.yaml
            - name: ATLANTIS_DATA_DIR
              value: /atlantis-data
            - name: ATLANTIS_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            {{- if include "atlantis.externalStoresEnabled" . }}
            - name: ATLANTIS_ENABLE_EXTERNAL_STORES
              value: "true"
            {{- end }}
            {{- if .Values.planRisk.enabled }}
            - name: ATLANTIS_PLAN_RISK_ENABLED
              value: "true"
            - name: ATLANTIS_PLAN_RISK_MAX_UNAPPROVED_TIER
              value: {{ .Values.planRisk.maxUnapprovedTier | quote }}
            - name: ATLANTIS_PLAN_RISK_FAILURE_TIER
              value: {{ .Values.planRisk.failureTier | quote }}
            - name: ATLANTIS_TYPESAFE_MODEL
              value: {{ .Values.planRisk.model | quote }}
            {{- end }}
            {{- if .Values.tracing.enabled }}
            - name: ATLANTIS_TRACING_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ required "tracing.endpoint is required when tracing is enabled" .Values.tracing.endpoint | quote }}
            - name: OTEL_TRACES_SAMPLER
              value: {{ .Values.tracing.sampler | quote }}
            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ .Values.tracing.samplerArg | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            # Fails only while starting or draining. It deliberately ignores
            # the Kubernetes API: every replica shares it, so an API outage
            # must not take all of them out of the Service at once.
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /atlantis-data
            - name: config
              mountPath: /etc/atlantis
              readOnly: true
      volumes:
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir:
            sizeLimit: {{ .Values.persistence.size }}
        {{- end }}
        - name: config
          configMap:
            name: {{ include "atlantis.fullname" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        {{- if .Values.topologySpreadConstraints }}
        {{- toYaml .Values.topologySpreadConstraints | nindent 8 }}
        {{- else }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "atlantis.selectorLabels" . | nindent 14 }}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "atlantis.selectorLabels" . | nindent 14 }}
        {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: {{- include "atlantis.selectorLabels" . | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
