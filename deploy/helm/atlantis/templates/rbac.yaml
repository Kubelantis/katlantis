# Atlantis keeps all shared state in its own namespace: Leases for locks,
# membership and leader election, and PullStatus resources for plan status.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "atlantis.fullname" . }}
  labels: {{- include "atlantis.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "create", "update", "delete"]
  - apiGroups: ["atlantis.runatlantis.io"]
    resources: ["pullstatuses"]
    verbs: ["get", "list", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "atlantis.fullname" . }}
  labels: {{- include "atlantis.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "atlantis.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "atlantis.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
