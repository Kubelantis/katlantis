{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "atlantis.fullname" . }}-cluster
  labels: {{- include "atlantis.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "atlantis.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    # Public port: from anywhere (webhooks, UI). Narrow this for your ingress.
    - ports:
        - port: 4141
    # Cluster port: only from other Atlantis replicas.
    - from:
        - podSelector:
            matchLabels: {{- include "atlantis.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.cluster.port }}
{{- end }}
